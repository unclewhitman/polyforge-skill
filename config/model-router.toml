# PolyForge single source of truth for model roles and orchestration behavior.
# Keep installed ~/.codex/agents/polyforge-*.toml synchronized with these role settings.

[release]
version = "2.1.0"

[orchestrator]
model = "gpt-6-sol"
reasoning_effort = "xhigh"
# Desired task setting; the skill cannot switch the active main-thread model.

[scout]
model = "gpt-6-luna"
reasoning_effort = "medium"
sandbox_mode = "read-only"

[architect]
model = "gpt-6-astra"
reasoning_effort = "medium"
sandbox_mode = "read-only"

[luna]
model = "gpt-6-luna"
reasoning_effort = "max"
sandbox_mode = "workspace-write"

[complex]
model = "gpt-6-sol"
reasoning_effort = "high"
sandbox_mode = "workspace-write"

[reviewer]
model = "gpt-6-sol"
reasoning_effort = "high"
sandbox_mode = "read-only"

[astra]
model = "gpt-6-astra"
reasoning_effort = "medium"
sandbox_mode = "workspace-write"

[understanding]
context_discovery_enabled = true
requirement_expansion_enabled = true
minimal_questioning = true
prefer_targeted_context = true
allow_infer_local_implementation_details = true
record_material_assumptions = true
ask_on_product_behavior_change = true
ask_on_data_model_change = true
ask_on_public_contract_change = true
ask_on_core_architecture_change = true
ask_on_security_boundary_change = true
ask_on_major_compatibility_change = true

[project_context]
enabled = true
path = ".polyforge/project-context.md"
legacy_path = ".multi-model-dev/project-context.md"
auto_create = true
auto_migrate_legacy = true
auto_update_after_success = true
load_before_context_discovery = true
verify_relevant_entries_before_use = true
repository_truth_wins = true
exclude_from_git = true
orchestrator_single_writer = true
redact_secrets = true
store_user_confirmed_decisions = true
store_repo_verified_architecture = true
store_stable_commands = true
store_reusable_conventions = true
store_task_history = false
store_temporary_debug_notes = false

[router]
scout_agent = "polyforge-scout"
architect_agent = "polyforge-architect"
default_worker = "polyforge-luna"
complex_worker = "polyforge-complex"
rescue_worker = "polyforge-astra"
reviewer_agent = "polyforge-reviewer"

lightweight_path_enabled = true
lightweight_skip_architect = true
lightweight_skip_reviewer = true
lightweight_max_files_signal = 2
lightweight_requires_clear_scope = true
lightweight_requires_low_risk = true

workflow_levels = ["light", "standard", "major"]
standard_orchestrator_design = true
standard_skip_architect = true
standard_skip_reviewer = true
major_requires_architect = true
major_requires_reviewer = true

luna_self_repair_attempts = 1
time_based_escalation = false
max_automatic_astra_invocations = 1
second_astra_requires_new_evidence = true
astra_minimum_scope_only = true
return_bounded_work_to_luna = true

parallel_enabled = true
parallel_requires_non_overlapping_scope = true
parallel_requires_dependencies_satisfied = true
max_parallel_workers = 2
parallel_fallback_to_serial = true

major_architecture_signals = [
  "irreversible-or-high-risk-migration",
  "cross-service-public-contract",
  "critical-security-boundary",
  "distributed-consistency-or-difficult-concurrency",
  "multi-module-core-architecture-replacement",
  "material-design-uncertainty-unresolved-by-sol"
]

complexity_escalators = [
  "security-sensitive", "权限/认证", "并发", "concurrency", "race condition",
  "migration", "数据迁移", "public API contract", "公共接口变更",
  "distributed", "分布式", "performance-critical", "性能敏感",
  "unknown-root-cause-debug", "疑难调试", "large-refactor", "大范围重构",
  "cross-module-state", "跨模块状态机"
]

stall_signals = [
  "自修复后仍未通过验收",
  "明确报告能力不足或无法继续",
  "反复在同一失败上循环且没有有效进展",
  "发现超出原规格的复杂依赖或高风险实现",
  "需要复杂架构决策而当前规格不足"
]
